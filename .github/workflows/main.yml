
name: Build SAQUIB HEADSHOT PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project
          find project -name settings.gradle

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAQUIB-HEADSHOT-PRO-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
